name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Build and upload Pages artifact
        uses: withastro/action@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify types and formatting
        run: pnpm check && pnpm lint && pnpm format:check
      - name: Smoke-test Pages output
        run: |
          test -f dist/index.html
          test -f dist/uses/index.html
          test -f dist/now/index.html
          test -f dist/projects/index.html
          test -f dist/contact/index.html
          test -f dist/404.html
          grep -qx 'me.moesegfault.dev' dist/CNAME

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
