name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build, verify, deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify Worker binding types
        run: pnpm exec wrangler types --include-runtime false --check
      - name: Type-check
        run: pnpm check
      - name: Run unit tests
        run: pnpm test:unit
      - name: Build static site
        run: pnpm build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify discovery routes
        run: pnpm verify:discovery
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Smoke-test Cloudflare routing
        run: pnpm exec playwright test --project=chromium
        env:
          PLAYWRIGHT_SKIP_BUILD: "1"
      - name: Deploy Worker and assets
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
